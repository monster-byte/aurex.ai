<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREX AI — NASDAQ-100 Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e14;
    --panel:#11161f;
    --panel-border:#1f2733;
    --text:#e7ecf3;
    --muted:#8b96a5;
    --green:#22c55e;
    --red:#ef4444;
    --amber:#f5b93d;
    --accent:#3ecf8e;
    --mono:'Consolas','SFMono-Regular',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Tahoma,sans-serif;
    padding:16px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:14px;
    margin-bottom:18px;
  }
  header h1{
    margin:0;
    font-size:1.4rem;
    letter-spacing:0.5px;
  }
  header h1 span{color:var(--accent);}
  header .sub{color:var(--muted);font-size:0.85rem;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:14px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:16px;
  }
  .panel h2{
    font-size:0.95rem;
    margin:0 0 12px 0;
    color:var(--muted);
    font-weight:600;
    text-transform:none;
  }
  .big-number{
    font-family:var(--mono);
    font-size:2rem;
    font-weight:600;
  }
  .row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid var(--panel-border);
    font-size:0.9rem;
  }
  .row:last-child{border-bottom:none;}
  .row .label{color:var(--muted);}
  .row .value{font-family:var(--mono);}
  .up{color:var(--green);}
  .down{color:var(--red);}
  .dot{
    display:inline-block;
    width:9px;height:9px;
    border-radius:50%;
    margin-left:6px;
  }
  .dot.green{background:var(--green);}
  .dot.yellow{background:var(--amber);}
  .dot.red{background:var(--red);}
  .decision-banner{
    grid-column:1/-1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    padding:20px;
    border-radius:10px;
    border:1px solid var(--panel-border);
  }
  .decision-banner.approved{background:linear-gradient(90deg,rgba(34,197,94,0.15),rgba(34,197,94,0.03));border-color:var(--green);}
  .decision-banner.hold{background:linear-gradient(90deg,rgba(245,185,61,0.15),rgba(245,185,61,0.03));border-color:var(--amber);}
  .decision-banner.reject{background:linear-gradient(90deg,rgba(239,68,68,0.15),rgba(239,68,68,0.03));border-color:var(--red);}
  .decision-banner .status{
    font-size:1.3rem;
    font-weight:700;
    font-family:var(--mono);
  }
  .headline{
    font-size:0.82rem;
    padding:5px 0;
    border-bottom:1px solid var(--panel-border);
    color:var(--muted);
  }
  .headline:last-child{border-bottom:none;}
  .headline .src{color:var(--accent);font-size:0.75rem;}
  canvas{max-height:220px;}
  .loading, .error-msg{color:var(--muted);font-size:0.85rem;padding:20px;text-align:center;}
  .error-msg{color:var(--red);}
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.75rem;
    margin-top:22px;
    padding-top:12px;
    border-top:1px solid var(--panel-border);
  }
</style>
</head>
<body>

<header>
  <h1>AUREX <span>AI</span> — NASDAQ-100 Intelligence</h1>
  <div class="sub" id="last-updated">جارِ التحميل...</div>
</header>

<div class="grid" id="dashboard">
  <div class="loading">جارِ تحميل البيانات...</div>
</div>

<footer>جميع البيانات متأخرة قليلاً (Delayed) — هذا ليس نصيحة استثمارية. AUREX AI Dashboard v0.1</footer>

<script>
const BASE = "./data";

async function fetchJSON(path) {
  try {
    const res = await fetch(path + "?t=" + Date.now());
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}function fmt(n, digits=2) {
  if (n === null  n === undefined  isNaN(n)) return "—";
  return Number(n).toLocaleString('en-US', {minimumFractionDigits: digits, maximumFractionDigits: digits});
}

function changeClass(v) {
  return v >= 0 ? "up" : "down";
}

function statusDot(status) {
  return <span class="dot ${status || 'yellow'}"></span>;
}

function factorLabel(key) {
  const labels = {
    mega_cap_alignment: "Mega-Cap Alignment",
    market_regime: "Market Regime",
    vxn: "VXN (Volatility)",
    us10y: "US 10Y Yield",
    dxy: "DXY (USD Strength)",
    macro: "Macro Environment",
    news_sentiment: "News & Sentiment",
  };
  return labels[key] || key;
}

function decisionClass(status) {
  if (!status) return "hold";
  if (status.includes("APPROVED")) return "approved";
  if (status.includes("REJECT")) return "reject";
  return "hold";
}

async function render() {
  const [priceData, signalData, riskData] = await Promise.all([
    fetchJSON(${BASE}/prices/snapshot_1D.json),
    fetchJSON(${BASE}/signal/signal_snapshot.json),
    fetchJSON(${BASE}/risk/risk_snapshot.json),
  ]);

  const dashboard = document.getElementById('dashboard');

  if (!priceData && !signalData && !riskData) {
    dashboard.innerHTML = '<div class="error-msg">تعذّر تحميل البيانات. تأكد أن ملفات data/ محدّثة ومنشورة.</div>';
    return;
  }

  document.getElementById('last-updated').textContent =
    "آخر تحديث: " + new Date(signalData?.generated_at  riskData?.generated_at  Date.now()).toLocaleString('ar-EG');

  let html = "";

  // ===== Final Decision Banner =====
  if (signalData?.final_decision) {
    const d = signalData.final_decision;
    const cls = decisionClass(d.ai_status);
    html += 
    <div class="decision-banner ${cls}">
      <div>
        <div style="color:var(--muted);font-size:0.85rem;">القرار النهائي (Final Decision)</div>
        <div class="status">${d.ai_status} — ${d.directional_bias}</div>
      </div>
      <div class="row" style="border:none;gap:24px;">
        <div><div class="label">Confirmation Score</div><div class="value big-number" style="font-size:1.3rem;">${fmt(signalData.confirmation_score)}%</div></div>
        <div><div class="label">Trade Probability</div><div class="value big-number" style="font-size:1.3rem;">${fmt(signalData.trade_probability)}%</div></div>
      </div>
    </div>;
  }

  // ===== NASDAQ-100 Price Panel =====
  if (priceData?.NASDAQ_100_INDEX) {
    const idx = priceData.NASDAQ_100_INDEX;
    html += 
    <div class="panel" style="grid-column:span 2;">
      <h2>NASDAQ-100 Index</h2>
      <div class="big-number ${changeClass(idx.change_pct)}">${fmt(idx.last_price)}</div>
      <div class="${changeClass(idx.change_pct)}" style="font-family:var(--mono);margin-bottom:10px;">
        ${idx.change >= 0 ? '+' : ''}${fmt(idx.change)} (${idx.change_pct >= 0 ? '+' : ''}${fmt(idx.change_pct)}%)
      </div>
      <canvas id="priceChart"></canvas>
    </div>;
  }

  // ===== Market Drivers =====
  const drivers = ["AAPL","MSFT","NVDA","AMZN","VXN","US10Y","DXY"];
  let driversRows = "";
  drivers.forEach(sym => {
    const d = priceData?.[sym];
    if (!d) return;
    driversRows += 
      <div class="row">
        <span class="label">${sym}</span>
        <span class="value ${changeClass(d.change_pct)}">${fmt(d.last_price)} (${d.change_pct >= 0 ? '+' : ''}${fmt(d.change_pct)}%)</span>
      </div>;
  });
  if (driversRows) {
    html += <div class="panel"><h2>Market Drivers</h2>${driversRows}</div>;
  }

  // ===== AI Signal & Confirmation =====
  if (signalData?.factors) {
    let factorRows = "";
    for (const [key, f] of Object.entries(signalData.factors)) {
      factorRows += 
        <div class="row">
          <span class="label">${statusDot(f.status)}${factorLabel(key)}</span>
          <span class="value">${fmt(f.score)}%</span>
        </div>;
    }
    html += <div class="panel" style="grid-column:span 2;"><h2>AI Signal & Confirmation</h2>${factorRows}</div>;
  }// ===== News Sentiment =====
  const news = signalData?.factors?.news_sentiment;
  if (news?.details?.top_headlines) {
    let headlines = "";
    news.details.top_headlines.slice(0,5).forEach(h => {
      headlines += <div class="headline">${h.title}<br><span class="src">${h.source || ''} — ${h.sentiment}</span></div>;
    });
    html += 
    <div class="panel">
      <h2>News Sentiment — ${news.details.overall_sentiment || 'N/A'}</h2>
      ${headlines}
    </div>;
  }

  // ===== Risk Overview =====
  if (riskData?.risk_overview) {
    const r = riskData.risk_overview;
    html += 
    <div class="panel">
      <h2>Risk Overview</h2>
      <div class="row"><span class="label">Account Equity</span><span class="value">$${fmt(r.account_equity_usd,0)}</span></div>
      <div class="row"><span class="label">Daily Risk Budget</span><span class="value">${fmt(r.daily_risk_budget_pct)}% ($${fmt(r.daily_risk_budget_usd,0)})</span></div>
      <div class="row"><span class="label">VaR (95%)</span><span class="value">${fmt(r.var_95_pct)}% ($${fmt(r.var_95_usd,0)})</span></div>
      <div class="row"><span class="label">Portfolio Beta</span><span class="value">${fmt(r.portfolio_beta)}</span></div>
      <div class="row"><span class="label">Correlation Risk</span><span class="value">${r.correlation_risk}</span></div>
      <div class="row"><span class="label">Liquidity</span><span class="value">${r.liquidity}</span></div>
      <div class="row"><span class="label">Current Exposure</span><span class="value" style="font-size:0.75rem;">${r.current_exposure}</span></div>
    </div>;
  }

  // ===== Position Sizing =====
  if (riskData?.position_sizing) {
    const p = riskData.position_sizing;
    if (p.tradeable) {
      html += 
      <div class="panel" style="grid-column:span 2;">
        <h2>Position Sizing — ${p.directional_bias}</h2>
        <div class="row"><span class="label">Entry Price</span><span class="value">${fmt(p.entry_price)}</span></div>
        <div class="row"><span class="label">Stop Loss</span><span class="value">${fmt(p.stop_loss_price)}</span></div>
        <div class="row"><span class="label">Take Profit 1 / 2</span><span class="value">${fmt(p.take_profit_1)} / ${fmt(p.take_profit_2)}</span></div>
        <div class="row"><span class="label">Recommended Size</span><span class="value">${p.recommended_size_contracts} ${p.instrument}</span></div>
        <div class="row"><span class="label">Notional Value</span><span class="value">$${fmt(p.notional_value_usd,0)}</span></div>
        <div class="row"><span class="label">Expected Value</span><span class="value">${p.expected_value_r}R</span></div>
      </div>;
    } else {
      html += 
      <div class="panel" style="grid-column:span 2;">
        <h2>Position Sizing</h2>
        <div class="headline">${p.reason}</div>
      </div>;
    }
  }

  dashboard.innerHTML = html;

  // ===== Draw price chart =====
  if (priceData?.NASDAQ_100_INDEX?.candles) {
    const candles = priceData.NASDAQ_100_INDEX.candles;
    const labels = candles.map(c => new Date(c.time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}));
    const closes = candles.map(c => c.close);
    const ctx = document.getElementById('priceChart');
    if (ctx) {
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            data: closes,
            borderColor: '#3ecf8e',
            backgroundColor: 'rgba(62,207,142,0.08)',
            borderWidth: 1.5,
            pointRadius: 0,
            fill: true,
            tension: 0.15,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { ticks: { color: '#8b96a5', font: { family: 'Consolas' } }, grid: { color: '#1f2733' } }
          }
        }
      });
    }
  }
}

render();
</script>

</body>
</html>
