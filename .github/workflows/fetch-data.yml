name: AUREX AI - Fetch Data

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r aurex-ai/requirements.txt

      - name: Run data layer
        working-directory: aurex-ai
        run: python -m src.data.run

      - name: Run signal engine
        working-directory: aurex-ai
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python -m src.signal.engine

      - name: Run risk engine
        working-directory: aurex-ai
        run: python -m src.risk.engine

      - name: Commit updated data
        run: |
          git config user.name "aurex-ai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add aurex-ai/data/
          git diff --quiet --cached || git commit -m "chore: auto-update market data + signal + risk [skip ci]"
          git push
